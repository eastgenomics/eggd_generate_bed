name: pytest
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with: 
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.8

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # Install pytest tooling from PyPI (not from local wheels)
      - name: Install test dependencies
        run: |
          python -m pip install pytest pytest-cov python-dateutil
        uses: pypa/gh-action-pip-audit@v1.1.0
      # Install your project/runtime wheels (offline/local)
      - name: Install project dependencies (local wheels)
        run: python3 -m pip install --no-index --no-deps ./resources/home/dnanexus/packages/*.whl

      - name: Run unit tests
        run: |
          python -m pytest ./resources/home/dnanexus/tests \
            --cov=./resources/home/dnanexus/tests \
            --cov-report=term \
            -v