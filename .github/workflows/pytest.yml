name: pytest
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # Install pytest tooling from PyPI (not from local wheels)
      - name: Install test dependencies
        run: |
          python -m pip install pytest pytest-cov python-dateutil

      # Install your project/runtime wheels (offline/local)
      - name: Install project dependencies (local wheels)
        run: python3 -m pip install --no-index --no-deps ./resources/home/dnanexus/packages/*.whl

      - name: Run unit tests
        run: |
          python -m pytest ./resources/home/dnanexus/tests \
            --cov=./home/dnanexus \
            --cov-report=term

      